services:
  postgres:
    image: postgres:16
    container_name: lumen-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: lumen_studio
      POSTGRES_USER: lumen
      POSTGRES_PASSWORD: lumen_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: